<section class="auth-page">
  <h1>Connexion</h1>
  <p>Connectez-vous pour accéder à votre espace client et commander un menu.</p>

  <form #formConnexion="ngForm" (ngSubmit)="connecter()">
    <label for="email">Adresse e-mail</label>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="exemple@email.fr"
      [(ngModel)]="email"
      required
    />

    <label for="motDePasse">Mot de passe</label>
    <input
      id="motDePasse"
      name="motDePasse"
      type="password"
      [(ngModel)]="motDePasse"
      required
    />

    <p *ngIf="message" class="message-succes" role="status">{{ message }}</p>
    <p *ngIf="erreur" class="message-erreur" role="alert">{{ erreur }}</p>

    <button type="submit" [disabled]="formConnexion.invalid || chargement">
      {{ chargement ? 'Connexion en cours...' : 'Se connecter' }}
    </button>
  </form>

  <p><a routerLink="/mot-de-passe-oublie">Mot de passe oublié ?</a></p>
  <p>
    Pas encore de compte ?
    <a routerLink="/inscription">Créer un compte</a>
  </p>
</section>
