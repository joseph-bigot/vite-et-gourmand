
<section class="auth-page">
  <h1>Créer un compte</h1>
  <p>Créez votre compte client pour pouvoir commander vos menus.</p>

  <form #formInscription="ngForm" (ngSubmit)="inscrire()">
    <label for="nom">Nom</label>
    <input
      id="nom"
      name="nom"
      type="text"
      [(ngModel)]="nom"
      maxlength="100"
      required
    />

    <label for="prenom">Prénom</label>
    <input
      id="prenom"
      name="prenom"
      type="text"
      [(ngModel)]="prenom"
      maxlength="100"
      required
    />

    <label for="email">Adresse e-mail</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="email"
      maxlength="255"
      required
    />

    <label for="telephone">Téléphone mobile</label>
    <input
      id="telephone"
      name="telephone"
      type="tel"
      [(ngModel)]="telephone"
      maxlength="20"
    />

    <label for="motDePasse">Mot de passe</label>
    <input
      id="motDePasse"
      name="motDePasse"
      type="password"
      [(ngModel)]="motDePasse"
      minlength="8"
      maxlength="72"
      required
    />

    <p *ngIf="message" class="message-succes" role="status">
      {{ message }}
    </p>

    <p *ngIf="erreur" class="message-erreur" role="alert">
      {{ erreur }}
    </p>

    <button
      type="submit"
      [disabled]="formInscription.invalid || chargement"
    >
      {{ chargement ? 'Création en cours...' : 'Créer mon compte' }}
    </button>
  </form>

  <p>
    Vous avez déjà un compte ?
    <a routerLink="/connexion">Se connecter</a>
  </p>
</section>
